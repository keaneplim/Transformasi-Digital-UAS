name: jelajah_taman
description: "Jelajah Taman — pemandu eksplorasi Tahura Ir. H. Djuanda (zona Dago Pakar)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Add a plugin only in the PR of the module that owns it (docs/engineering/ARCHITECTURE.md §3, rule R5).
# Commit pubspec.lock. Don't upgrade dependencies during Sprint 4–5.
dependencies:
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1 # module location only (R5)
  flutter_map: ^8.3.2
  flutter_riverpod: ^2.6.1
  geolocator: ^14.1.2 # module location only (R5)
  go_router: ^14.6.0
  just_audio: ^0.10.6 # module audio only (R5)
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6 # core only (R5)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/images/
    - assets/audio/
    - assets/map/ # bundled vector basemap + hillshade (tools/osm_to_basemap.py)

  # Bundled (offline, A01) variable fonts, SIL OFL — licences in assets/fonts/.
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
